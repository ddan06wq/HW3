<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/ico" href="dani_monograma_verde.png">
</head>
<body>
    <header>
        <div class="rectangle-header">
            <a href="index.html"><img src="dani_monograma_verde.png" alt="The Site's Logo" class="logo"></a>
        </div>
    </header>
    <div class="chat-container" id="chat-container">
    </div>
    <form id="chat-form">
        <div class="input-box">
            <input type="text" id="user-input" placeholder="Answer Here..." class="ui">
            <button type="submit" class="custom-button">Send</button>
        </div> 
    </form>
    <script src="chatbot.js"></script>
    <footer>2026 | Daniel Donea</footer>
</body>
        
</html>
